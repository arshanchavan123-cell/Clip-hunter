name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -oq "$(ls *.zip | head -1)" -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.0
      - run: gradle assembleDebug --no-daemon
        working-directory: src/AIClipHunter
      - run: cp src/AIClipHunter/app/build/outputs/apk/debug/app-debug.apk AI-Clip-Hunter.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AI Clip Hunter build ${{ github.run_number }}
          files: AI-Clip-Hunter.apk
